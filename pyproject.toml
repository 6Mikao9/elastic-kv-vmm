[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-kv-vmm"
version = "0.1.0"
description = "Demand-backed CUDA VMM KV storage for a pinned SGLang server"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
elastic-sglang = "elastic_kv.launch:main"

[tool.setuptools]
packages = ["elastic_kv"]
