[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-kv-vmm"
version = "0.1.0"
description = "Demand-backed CUDA VMM KV storage for SGLang"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
elastic-sglang = "elastic_kv.launch:main"
elastic-future-plan = "adaptive_sparse.future_plan:main"

[tool.setuptools.packages.find]
include = ["elastic_kv*", "adaptive_sparse*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
