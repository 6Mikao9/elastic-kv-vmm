name: CPU compatibility

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install numpy requests ruff
          python -m pip install --no-deps -e .
      - name: Compile Python
        run: python -m compileall -q elastic_kv adaptive_sparse native tests
      - name: Check actionable lint failures
        run: ruff check --select E9,F63,F7,F82 elastic_kv adaptive_sparse native tests
      - name: Run CPU suite
        run: python -m unittest discover -s tests

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Build wheel without network isolation
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Verify packaged native source and commands
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("elastic_kv_vmm-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "native/elastic_vmm.cpp" in names
              entry_points = next(
                  archive.read(name).decode("utf-8")
                  for name in names
                  if name.endswith("entry_points.txt")
              )
              assert "elastic-kv-build-vmm" in entry_points
              assert "elastic-sglang" in entry_points
          PY
